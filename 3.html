<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘇妍蓁 | 專業履歷表</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        header {
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }
        .photo-area {
            flex: 0 0 130px;
            margin-right: 25px;
        }
        .photo-area img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            display: block;
        }
        .header-text {
            flex: 1;
        }
        .header-text h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2.2em;
            letter-spacing: 2px;
        }
        .contact-info {
            margin-top: 10px;
            font-size: 0.95em;
            color: #555;
        }
        .qr-code-area {
            flex: 0 0 110px;
            text-align: center;
            margin-left: 20px;
        }
        .qr-code-area img {
            width: 100px;
            height: 100px;
            border: 1px solid #eee;
            padding: 5px;
            background: #fff;
        }
        .qr-text {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        section {
            margin-bottom: 30px;
        }
        h2 {
            color: var(--accent-color);
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
            font-size: 1.4em;
            margin-bottom: 15px;
            background: rgba(52, 152, 219, 0.05);
            padding-top: 8px;
            padding-bottom: 8px;
        }
        .experience-item {
            margin-bottom: 25px;
        }
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .company-title {
            font-weight: bold;
            font-size: 1.15em;
            color: var(--primary-color);
        }
        .duration-tag {
            background: #e1f5fe;
            color: #0288d1;
            padding: 2px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 10px;
        }
        .date-range {
            color: #777;
            font-size: 0.9em;
        }
        ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 6px;
        }
        .achievement-box {
            background-color: #fffde7;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid #fbc02d;
            margin-top: 10px;
            font-size: 0.95em;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        /* 行動裝置適應更新 */
        @media (max-width: 768px) {
            header { 
                flex-direction: column; 
                text-align: center; 
            }
            .photo-area { 
                margin-right: 0; 
                margin-bottom: 15px; 
            }
            .qr-code-area { 
                display: block; 
                margin-left: 0; 
                margin-top: 15px; 
            }
            .job-header { 
                flex-direction: column; 
                align-items: flex-start; 
            }
            .duration-tag { 
                margin-left: 0; 
                margin-top: 5px; 
                display: inline-block; 
            }
        }
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; }
            .qr-code-area { display: block !important; }
        }
    </style>
</head>
